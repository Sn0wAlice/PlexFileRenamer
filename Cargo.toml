[package]
name = "plexfilerenamer"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
minijinja = { version = "3.0.1", features = ["builtins", "serde", "json", "preserve_order"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "collation"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"
